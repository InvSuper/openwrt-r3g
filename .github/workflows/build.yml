name: 编译 OpenWrt 固件

# 触发方式：仅在 Actions 页面手动点击 "Run workflow" 时编译
# 手动触发的原因：固件编译是低频操作，按需触发即可，不浪费 CI 额度
on:
  workflow_dispatch:
    inputs:
      profile:
        description: '设备 Profile（本机=小米路由器4 R4，机身标签已确认；Breed 布局=小米 R3G/4 双分区 NAND）'
        required: true
        type: choice
        default: 'xiaomi_mi-router-4'
        options:
          - 'xiaomi_mi-router-4'        # 小米路由器4 R4（128MB NAND，kernel1+rootfs0 双分区，本仓库目标设备）
          - 'xiaomi_mi-router-3g'       # 小米路由器3G R3G v1（布局相同，备用）
          - 'xiaomi_mi-router-4a-gigabit' # 小米路由器4A千兆版 R4A（16MB NOR，布局不同，备用）

env:
  # 官方 ImageBuilder 地址：25.12.6 稳定版 / ramips / mt7621
  # 选用稳定版而不是 25.12-SNAPSHOT 的原因：快照每天滚动更新，同一个 commit 今天编和
  # 明天编出来的内核、驱动、包版本都可能不同，出现问题时无法定位；稳定版固定不变，可复现
  # 升级方式：只改下面 IB_URL 里的版本号（路径和文件名各出现一次，两处都要替换）
  IB_URL: https://downloads.openwrt.org/releases/25.12.6/targets/ramips/mt7621/openwrt-imagebuilder-25.12.6-ramips-mt7621.Linux-x86_64.tar.zst

  # 包清单：在官方默认包的基础上增删（- 前缀 = 从默认包中移除）
  #
  # 默认包参考（25.12.6 官方 profiles.json，与 25.12-SNAPSHOT 一致）：
  #   apk-mbedtls base-files ca-bundle dnsmasq dropbear firewall4 fstools
  #   kmod-crypto-hw-eip93 kmod-gpio-button-hotplug kmod-leds-gpio kmod-nft-offload
  #   libc libgcc libustream-mbedtls logd mtd netifd nftables odhcp6c odhcpd-ipv6only
  #   ppp ppp-mod-pppoe procd-ujail uboot-envtools uci uclient-fetch urandom-seed urngd
  #   wpad-basic-mbedtls + 设备自带 kmod-mt7603 kmod-mt76x2
  #   （R3G 才额外带 kmod-usb3 kmod-usb-ledtrig-usbport；小米4 的默认包不含 USB，
  #    这两个 - 前缀在 4 的 profile 下是多余的，但 ImageBuilder 会静默忽略，保留无害）
  #
  # 包策略：保守为主，确保基础功能（SSH、LuCI、网络）稳定
  # 教训：build-5 加 luci-mod-admin-full 导致依赖缺失系统崩溃；
  #       build-6 过度精简导致 dropbear 起不来。本版本回归稳定优先。
  #
  # 保留官方默认包（只明确删 WiFi 和 PPP，其他不动）：
  #   dnsmasq : 保留，避免删除后影响系统初始化
  #   firewall4 / nftables : 保留，避免影响网络栈
  #   odhcp6c / odhcpd-ipv6only : 保留，IPv6 由 ZN M2 管理，但保留客户端无害
  #
  # 明确删除（确实用不上且安全的）：
  #   ppp / ppp-mod-pppoe : 不拨号
  #   wpad-basic-mbedtls / kmod-mt7603 / kmod-mt76x2 : 不用 WiFi
  #   kmod-usb3 / kmod-usb-ledtrig-usbport : 不用 USB（R3G 才有，4 没有）
  #
  # 新增：
  #   luci-light : 基础 Web 界面
  #   luci-i18n-base-zh-cn : 中文语言包
  #   luci-app-commands : LuCI 命令执行页面（备用终端）
  #   ip-full / tcpdump / ethtool / nano / htop : 调试工具
  PACKAGES: >-
    luci-light luci-i18n-base-zh-cn luci-app-commands
    ip-full tcpdump ethtool nano htop
    -ppp -ppp-mod-pppoe
    -wpad-basic-mbedtls -kmod-mt7603 -kmod-mt76x2
    -kmod-usb3 -kmod-usb-ledtrig-usbport

jobs:
  build:
    runs-on: ubuntu-latest
    # 创建 Release 需要写权限；GitHub 默认给 GITHUB_TOKEN 只读，必须显式提权
    permissions:
      contents: write
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget zstd rsync file \
            gawk gettext libncurses-dev libssl-dev unzip python3

      - name: 下载并解压 ImageBuilder
        run: |
          wget -q "$IB_URL" -O imagebuilder.tar.zst
          tar --zstd -xf imagebuilder.tar.zst
          mv openwrt-imagebuilder-* imagebuilder

      - name: 编译固件
        run: |
          cd imagebuilder
          FILES_ARG=""
          if [ -d ../files ]; then
            cp -r ../files ./files
            FILES_ARG="FILES=files"
          fi
          make image PROFILE="${{ inputs.profile }}" PACKAGES="${PACKAGES}" $FILES_ARG

      - name: 列出生成的固件
        run: ls -lh imagebuilder/bin/targets/ramips/mt7621/

      # 上传全部 .bin：Breed 刷 NAND 双分区布局需要 kernel1.bin + rootfs0.bin 两个文件
      # （分别对应 Breed 页面的两个上传框）；sysupgrade.bin 留作日后系统内升级用
      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ inputs.profile }}
          path: |
            imagebuilder/bin/targets/ramips/mt7621/*.bin
            imagebuilder/bin/targets/ramips/mt7621/sha256sums
          retention-days: 90

      # 从本次 ImageBuilder 产出的 profiles.json 中读取真实版本号
      # 原因：SNAPSHOT 每天滚动更新，必须记录"这个固件是由哪天哪个 revision 编出来的"
      - name: 读取本次固件版本
        id: ver
        run: |
          PJ=imagebuilder/bin/targets/ramips/mt7621/profiles.json
          VER=$(python3 -c "import json;print(json.load(open('$PJ'))['version_number'])" 2>/dev/null || true)
          CODE=$(python3 -c "import json;print(json.load(open('$PJ'))['version_code'])" 2>/dev/null || true)
          echo "version=${VER:-unknown}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE:-unknown}" >> "$GITHUB_OUTPUT"

      # 自动发布 Release：把固件挂到仓库首页 Releases 区，手机上不用再翻 Actions
      # 使用 runner 自带的 gh CLI（ubuntu-latest 预装），不引入第三方 action
      # 标记为 latest release（上游是正式稳定版，无需 prerelease 标记）
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
          PROFILE: ${{ inputs.profile }}
        run: |
          TAG="build-${{ github.run_number }}"
          NOTES=$(cat <<EOF
          由 GitHub Actions 自动构建，上游为 OpenWrt 正式稳定版。

          - 上游版本：OpenWrt ${VER}（${CODE}）
          - 设备 Profile：\`${PROFILE}\`
          - 包清单：\`${PACKAGES}\`

          **Breed 刷机**：\`*-squashfs-kernel1.bin\` 传第一个框，\`*-squashfs-rootfs0.bin\` 传第二个框。
          **系统内升级**：\`*-squashfs-sysupgrade.bin\`（LuCI 系统→备份升级 或 sysupgrade 命令）。
          **管理地址**：192.168.0.2（首次开机由 uci-defaults 预设，账号 root/root）。
          EOF
          )
          # 用 ls 展开实际存在的文件，避免某个镜像类型不存在时 gh 报错
          FILES=$(ls imagebuilder/bin/targets/ramips/mt7621/*.bin \
                    imagebuilder/bin/targets/ramips/mt7621/sha256sums)
          gh release create "$TAG" \
            --title "OpenWrt ${VER} (${CODE}) · ${PROFILE}" \
            --notes "$NOTES" \
            $FILES
